<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Owner - UZIIFAUNAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

    <div class="bg-[#161f14] p-8 rounded-2xl border border-[#233220] w-full max-w-sm shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-white text-xl font-extrabold tracking-wider">OWNER LOGIN</h2>
            <p class="text-slate-500 text-xs mt-1">Autentikasi akses sistem portofolio</p>
        </div>
        
        <div id="msg" class="hidden bg-red-950/30 border border-red-900/50 text-red-400 text-[10px] p-3 rounded-lg mb-4 text-center">
            Kredensial salah! Akses ditolak.
        </div>

        <form onsubmit="return false;" class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Username</label>
                <input type="text" id="user" class="w-full bg-[#0b0f09] border border-[#233220] rounded-lg p-2.5 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Password</label>
                <input type="password" id="pass" class="w-full bg-[#0b0f09] border border-[#233220] rounded-lg p-2.5 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>
            <button id="btn-login" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 text-xs font-bold py-3 rounded-lg transition mt-2">
                AUTENTIKASI MASUK
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-[10px] text-slate-500 hover:text-emerald-400 transition underline decoration-dotted">Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        document.getElementById('btn-login').addEventListener('click', function() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            const msg = document.getElementById('msg');

            // Cek kredensial
            if (u === "UZI" && p === "ABHINAYA2013") {
                localStorage.setItem('uzi_session_active', 'true');
                window.location.href = 'owner.html';
            } else {
                msg.classList.remove('hidden');
                // Efek visual jika salah
                document.querySelector('.bg-[#161f14]').classList.add('animate-pulse');
                setTimeout(() => {
                    document.querySelector('.bg-[#161f14]').classList.remove('animate-pulse');
                }, 500);
            }
        });

        // Dukungan tekan Enter
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('btn-login').click();
            }
        });
    </script>
</body>
</html>
