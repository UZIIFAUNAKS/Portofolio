<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Owner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="bg-black p-8 rounded-xl border border-gray-700 w-full max-w-sm">
        <h2 class="text-white text-center mb-6 font-bold">OWNER LOGIN</h2>
        
        <div id="msg" class="hidden text-red-500 text-xs text-center mb-4 font-bold">
            LOGIN GAGAL!
        </div>

        <form id="form-login" class="space-y-4">
            <input type="text" id="user" placeholder="USER ID" class="w-full p-2 bg-gray-800 text-white rounded border border-gray-600">
            <input type="password" id="pass" placeholder="PASSWORD" class="w-full p-2 bg-gray-800 text-white rounded border border-gray-600">
            <button type="button" id="btn-login" class="w-full bg-emerald-500 py-2 rounded font-bold text-black">
                AUTENTIKASI MASUK
            </button>
        </form>
    </div>

    <script>
        document.getElementById('btn-login').addEventListener('click', function() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            const msg = document.getElementById('msg');

            // Cek kredensial
            if (u === "UZI" && p === "ABHINAYA2013") {
                localStorage.setItem('uzi_session_active', 'true');
                window.location.href = 'owner.html';
            } else {
                msg.classList.remove('hidden');
                console.log("Salah input");
            }
        });
    </script>
</body>
</html>
