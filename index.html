<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio UZIIFAUNAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .active-tab { background-color: #233220; color: #4ade80; border-bottom: 2px solid #4ade80; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <header class="w-full bg-[#121910] border-b border-[#233220] py-8 px-4 relative">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center">
            <h1 class="text-3xl font-extrabold text-emerald-400 tracking-wider mb-2">UZIIFAUNAK</h1>
            <p id="bio-text" class="text-slate-400 text-sm max-w-md">Loading bio...</p>
            
            <div class="flex gap-6 mt-6 items-center">
                <a href="#" target="_blank" class="text-4xl text-[#5865F2] hover:scale-110 hover:-translate-y-1 transition-all duration-300" title="Discord"><i class="fa-brands fa-discord"></i></a>
                <a href="#" target="_blank" class="text-4xl text-[#E1306C] hover:scale-110 hover:-translate-y-1 transition-all duration-300" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" target="_blank" class="text-4xl text-[#0A66C2] hover:scale-110 hover:-translate-y-1 transition-all duration-300" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#" target="_blank" class="text-4xl text-white hover:scale-110 hover:-translate-y-1 transition-all duration-300" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" target="_blank" class="w-10 h-10 hover:scale-110 hover:-translate-y-1 transition-all duration-300 rounded overflow-hidden flex items-center justify-center bg-white/90 p-1" title="Canva">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/cb/Canva_Logo.png" alt="Canva" class="w-full h-full object-contain">
                </a>
            </div>
        </div>
    </header>

    <nav class="flex justify-center gap-2 py-4 bg-[#0b0f09] border-b border-[#1d291a] sticky top-0 z-50 text-xs sm:text-sm px-2">
        <button onclick="switchTab('home')" id="tab-home" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition active-tab font-semibold">Status Harian</button>
        <button onclick="switchTab('pengalaman')" id="tab-pengalaman" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition font-semibold">Pengalaman & Sertifikat</button>
        <button onclick="switchTab('video')" id="tab-video" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition font-semibold">Video Random</button>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-1">
        
        <section id="content-home" class="tab-content">
            <h2 class="text-xl font-bold text-white mb-6 border-l-4 border-emerald-500 pl-3">Aktivitas Terkini</h2>
            <div id="widgets-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </section>

        <section id="content-pengalaman" class="tab-content hidden">
            <h2 class="text-xl font-bold text-white mb-6 border-l-4 border-emerald-500 pl-3">Portofolio & Sertifikat</h2>
            <div id="experience-list-container" class="grid grid-cols-1 gap-6">
                </div>
        </section>

        <section id="content-video" class="tab-content hidden">
            <h2 class="text-xl font-bold text-white mb-6 border-l-4 border-emerald-500 pl-3">Galeri Video</h2>
            <div id="video-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </section>

    </main>

    <footer class="text-center py-6 border-t border-[#233220] mt-auto">
        <p class="text-xs text-slate-500">&copy; 2026 UZIIFAUNAK Workspace. All Rights Reserved.</p>
    </footer>

    <script>
        // Inisialisasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e",
            measurementId: "G-0ZJTEGNXTW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Fungsi Waktu (Time Ago)
        function timeAgo(ms) {
            if (!ms) return 'Waktu tidak diketahui';
            const seconds = Math.floor((new Date() - ms) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " tahun yang lalu";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " bulan yang lalu";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " hari yang lalu";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " jam yang lalu";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " menit yang lalu";
            return Math.floor(seconds) + " detik yang lalu";
        }

        // Navigasi Tab
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab', 'text-white'));
            document.getElementById(`content-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('active-tab', 'text-white');
        }

        // Fetch Data Profile
        db.ref('profile/').on('value', snap => {
            const data = snap.val();
            if(data && data.bio) document.getElementById('bio-text').innerText = data.bio;
        });

        // Fetch Data Status (Widgets)
        db.ref('widgets/').on('value', snap => {
            const container = document.getElementById('widgets-container');
            container.innerHTML = '';
            if(!snap.exists()) { container.innerHTML = '<p class="text-xs text-slate-500 italic">Belum ada status.</p>'; return; }
            
            // Reverse data agar yang terbaru di atas
            const widgets = [];
            snap.forEach(child => widgets.unshift(child.val()));

            widgets.forEach(w => {
                let mediaHtml = '';
                if(w.media) {
                    if(w.media.match(/\.(mp4|webm|ogg)$/i)) {
                        mediaHtml = `<video src="${w.media}" controls class="w-full mt-3 rounded-lg border border-[#233220]"></video>`;
                    } else {
                        mediaHtml = `<img src="${w.media}" alt="Media lampiran" class="w-full mt-3 rounded-lg border border-[#233220] object-cover max-h-64">`;
                    }
                }

                container.innerHTML += `
                <div class="card-dark p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start border-b border-[#233220] pb-2 mb-3">
                            <div>
                                <span class="bg-emerald-900/30 text-emerald-400 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">${w.type || 'STATUS'}</span>
                                <p class="text-xs text-slate-400 mt-1 font-semibold"><i class="fa-solid fa-user-pen mr-1"></i> ${w.sender || 'Anonymous'}</p>
                            </div>
                            <span class="text-[10px] text-slate-500 bg-[#0b0f09] px-2 py-1 rounded shadow"><i class="fa-regular fa-clock mr-1"></i> ${timeAgo(w.timestamp)}</span>
                        </div>
                        <h3 class="text-sm font-bold text-white mb-1">${w.short_note || ''}</h3>
                        <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap">${w.long_note || ''}</p>
                        ${mediaHtml}
                    </div>
                </div>`;
            });
        });

        // Fetch Data Pengalaman
        db.ref('experiences/').on('value', snap => {
            const container = document.getElementById('experience-list-container');
            container.innerHTML = '';
            if(!snap.exists()) { container.innerHTML = '<p class="text-xs text-slate-500 italic">Belum ada pengalaman.</p>'; return; }
            
            const exps = [];
            snap.forEach(child => exps.unshift(child.val()));

            exps.forEach(e => {
                let imgHtml = e.img ? `<img src="${e.img}" alt="Sertifikat" class="mt-4 w-full md:w-48 h-auto object-cover rounded-xl border border-emerald-900/50">` : '';
                
                // Bintang
                let starsHtml = '';
                const starCount = parseInt(e.stars) || 0;
                for(let i=0; i<5; i++) {
                    starsHtml += `<i class="fa-solid fa-star ${i < starCount ? 'text-amber-400' : 'text-slate-600'} text-xs"></i>`;
                }

                container.innerHTML += `
                <div class="card-dark p-5 rounded-2xl">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 flex-wrap mb-2">
                                <h3 class="text-lg font-bold text-white uppercase">${e.title}</h3>
                                <div class="flex bg-black/40 px-2 py-1 rounded-lg border border-yellow-900/30 gap-1">${starsHtml}</div>
                            </div>
                            <span class="text-[11px] text-emerald-400 font-medium inline-block bg-emerald-900/20 px-2 py-1 rounded mb-3">
                                <i class="fa-regular fa-calendar-days mr-1.5"></i> ${e.start_date || '?'} - ${e.end_date || 'Sekarang'}
                            </span>
                            <p class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">${e.summary}</p>
                            <div class="mt-4 pt-3 border-t border-[#233220] flex items-center text-[10px] text-slate-500">
                                <i class="fa-regular fa-clock mr-1.5"></i> Diupload ${timeAgo(e.timestamp)}
                            </div>
                        </div>
                        ${imgHtml}
                    </div>
                </div>`;
            });
        });

        // Fetch Data Video
        db.ref('videos/').on('value', snap => {
            const container = document.getElementById('video-grid-container');
            container.innerHTML = '';
            if(!snap.exists()) { container.innerHTML = '<p class="text-xs text-slate-500 italic">Belum ada video.</p>'; return; }
            
            const vids = [];
            snap.forEach(child => vids.unshift(child.val()));

            vids.forEach(v => {
                container.innerHTML += `
                <div class="card-dark p-3 rounded-2xl overflow-hidden flex flex-col justify-between">
                    <div>
                        <video src="${v.url}" controls class="w-full rounded-xl bg-black aspect-video object-cover"></video>
                        <h3 class="text-sm font-bold text-white mt-3 px-1">${v.title}</h3>
                    </div>
                    <div class="mt-3 px-1 flex items-center text-[10px] text-slate-500">
                        <i class="fa-regular fa-clock mr-1.5"></i> ${timeAgo(v.timestamp)}
                    </div>
                </div>`;
            });
        });

        document.addEventListener("DOMContentLoaded", () => { switchTab('home'); });
    </script>
</body>
</html>
