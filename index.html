<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio UZIIFAUNAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .active-tab { background-color: #233220; color: #4ade80; border-bottom: 2px solid #4ade80; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <nav class="bg-[#121910]/90 backdrop-blur-md border-b border-[#233220] px-4 py-4 sticky top-0 z-50 flex justify-between items-center">
        <span class="font-extrabold text-lg text-emerald-400 tracking-wider">UZIIFAUNAK</span>
        <a href="login.html" class="bg-emerald-900/30 text-emerald-400 border border-emerald-900/50 text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-emerald-500 hover:text-white transition">OWNER LOGIN</a>
    </nav>

    <header class="max-w-4xl mx-auto px-4 py-10 text-center">
        <div class="w-24 h-24 mx-auto bg-emerald-900 rounded-full mb-4 border-2 border-emerald-500 overflow-hidden flex items-center justify-center">
    <a href="LINK_TUJUAN_ANDA">
        <img src="https://cdn.discordapp.com/attachments/1142606456558977024/1506000533188644864/WhatsApp_Image_2026-05-19_at_01.23.21.jpeg?ex=6a0cabcb&is=6a0b5a4b&hm=6bc369302caffa0b6b52f6434dcc2e9faa45b8168c352df6420e1fd3f95b1f37&" alt="Foto Profil" class="w-full h-full object-cover">
    </a>
</div>
        <h1 id="profile-name" class="text-2xl font-bold text-white">Memuat...</h1>
        <p id="profile-bio" class="text-sm text-slate-400 mt-2 max-w-lg mx-auto">Memuat...</p>
        
        <div class="flex flex-wrap justify-center items-center gap-6 mt-6">
            <a href="https://discord.gg/97y4p32jWz" target="_blank" class="text-4xl text-[#5865F2] hover:scale-110 transition drop-shadow-[0_0_8px_rgba(88,101,242,0.5)]"><i class="fa-brands fa-discord"></i></a>
            <a href="https://www.instagram.com/uziifaunak/" target="_blank" class="text-4xl text-[#E1306C] hover:scale-110 transition drop-shadow-[0_0_8px_rgba(225,48,108,0.5)]"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.linkedin.com/in/abhinayafauzi/" target="_blank" class="text-4xl text-[#0077B5] hover:scale-110 transition drop-shadow-[0_0_8px_rgba(0,119,181,0.5)]"><i class="fa-brands fa-linkedin"></i></a>
            <a href="https://www.tiktok.com/@uziifaunak" target="_blank" class="text-4xl text-white hover:scale-110 transition drop-shadow-[0_0_8px_rgba(255,255,255,0.5)]"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-8 flex-1">
        <div class="flex justify-center gap-2 mb-8 text-[11px] font-bold uppercase tracking-wide">
            <button onclick="switchTab('status')" id="tab-status" class="px-5 py-2.5 rounded-xl active-tab transition">Status Live</button>
            <button onclick="switchTab('pengalaman')" id="tab-pengalaman" class="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white transition">Pengalaman</button>
            <button onclick="switchTab('video')" id="tab-video" class="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white transition">Video</button>
        </div>

        <section id="content-status" class="tab-content grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>
        <section id="content-pengalaman" class="tab-content hidden grid grid-cols-1 md:grid-cols-2 gap-6"></section>
        <section id="content-video" class="tab-content hidden grid grid-cols-1 md:grid-cols-3 gap-6"></section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e",
            measurementId: "G-0ZJTEGNXTW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('main button').forEach(b => b.classList.remove('active-tab', 'text-emerald-400'));
            document.querySelectorAll('main button').forEach(b => b.classList.add('text-slate-400'));
            
            document.getElementById(`content-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('active-tab', 'text-emerald-400');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-400');
        }

        function timeAgo(ms) {
            if(!ms) return 'Baru saja';
            const sec = Math.floor((new Date() - ms) / 1000);
            if (isNaN(sec) || sec < 0) return 'Baru saja';
            if (sec < 60) return sec + ' detik lalu';
            if (sec < 3600) return Math.floor(sec / 60) + ' menit lalu';
            if (sec < 86400) return Math.floor(sec / 3600) + ' jam lalu';
            return Math.floor(sec / 86400) + ' hari lalu';
        }

        // Real-time Profile
        db.ref('profile/').on('value', snap => {
            const data = snap.val() || {};
            document.getElementById('profile-name').innerText = data.name || 'UZIIFAUNAK';
            document.getElementById('profile-bio').innerText = data.bio || 'Bio belum diatur.';
        });

        // Real-time Status Update (Fix Multi-spot & Anti-Crash)
        db.ref('widgets/').on('value', snap => {
            let htmlContent = ''; 
            let items = [];
            
            snap.forEach(child => {
                const val = child.val();
                // Filter: Hanya ambil data yang berformat Object (Hasil push baru)
                if (val && typeof val === 'object' && !child.key.match(/^(type|sender|short_note|long_note|file)$/)) {
                    items.push(val);
                }
            });
            
            items.reverse().forEach(w => {
                let fileHtml = '';
                if(w.file && typeof w.file === 'string') {
                    if(w.file.match(/\.(mp4|webm|ogg)$/i)) {
                        fileHtml = `<video src="${w.file}" controls class="w-full mt-3 rounded-lg border border-emerald-900/40"></video>`;
                    } else {
                        fileHtml = `<img src="${w.file}" class="w-full mt-3 rounded-lg border border-emerald-900/40" alt="File">`;
                    }
                }
                
                htmlContent += `
                <div class="card-dark p-5 rounded-2xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[10px] bg-emerald-900/40 text-emerald-400 font-bold px-2 py-1 rounded uppercase tracking-wider">${w.type || 'STATUS'}</span>
                            <span class="text-[10px] text-slate-400"><i class="fa-solid fa-user-pen mr-1"></i> ${w.sender || 'Admin'}</span>
                        </div>
                        ${w.short_note ? `<h3 class="font-bold text-white text-sm mb-1">${w.short_note}</h3>` : ''}
                        <p class="text-xs text-slate-300 leading-relaxed">${w.long_note || w.content || ''}</p>
                        ${fileHtml}
                    </div>
                    <span class="text-[9px] text-slate-500 block mt-4 border-t border-emerald-900/30 pt-3"><i class="fa-regular fa-clock mr-1"></i> ${timeAgo(w.timestamp)}</span>
                </div>`;
            });
            
            document.getElementById('content-status').innerHTML = htmlContent || '<p class="text-slate-500 italic col-span-full text-center">Belum ada pembaruan status.</p>';
        });

        // Real-time Pengalaman Update (Fix Multi-spot & Anti-Crash)
        db.ref('experiences/').on('value', snap => {
            let htmlContent = '';
            let items = [];
            
            snap.forEach(child => {
                const val = child.val();
                // Filter data sampah lama
                if (val && typeof val === 'object' && !child.key.match(/^(title|summary|date|stars|img)$/)) {
                    items.push(val);
                }
            });
            
            items.reverse().forEach(e => {
                let imgHtml = e.img ? `<img src="${e.img}" class="w-full mt-4 rounded-xl border border-emerald-900/50" alt="Sertifikat">` : '';
                htmlContent += `
                <div class="card-dark p-6 rounded-2xl relative">
                    <div class="flex justify-between items-start gap-4">
                        <div>
                            <h3 class="font-bold text-white text-base">${e.title || 'Tanpa Judul'}</h3>
                            <p class="text-[11px] text-emerald-400 mt-1 font-medium"><i class="fa-regular fa-calendar-days mr-1.5"></i> ${e.date || 'Tanggal tidak diatur'}</p>
                        </div>
                        <div class="bg-[#0b0f09] border border-emerald-950/60 px-3 py-1 rounded-lg text-amber-400 text-xs font-bold flex items-center gap-1 shrink-0">
                            <i class="fa-solid fa-star text-[10px]"></i> ${e.stars || '0'}
                        </div>
                    </div>
                    <p class="text-xs text-slate-400 mt-4 leading-relaxed">${e.summary || ''}</p>
                    ${imgHtml}
                    <div class="mt-4 pt-3 border-t border-emerald-900/30 text-[9px] text-slate-500">
                        <i class="fa-regular fa-clock mr-1"></i> Ditambahkan ${timeAgo(e.timestamp)}
                    </div>
                </div>`;
            });
            
            document.getElementById('content-pengalaman').innerHTML = htmlContent || '<p class="text-slate-500 italic col-span-full text-center">Belum ada data pengalaman.</p>';
        });

        // Real-time Video Update (Fix Multi-spot & Anti-Crash)
        db.ref('videos/').on('value', snap => {
            let htmlContent = '';
            let items = [];
            
            snap.forEach(child => {
                const val = child.val();
                // Filter data sampah lama
                if (val && typeof val === 'object' && !child.key.match(/^(title|url)$/)) {
                    items.push(val);
                }
            });
            
            items.reverse().forEach(v => {
                htmlContent += `
                <div class="card-dark rounded-xl overflow-hidden p-3 pb-4">
                    <video src="${v.url}" controls class="w-full rounded-lg bg-black aspect-video"></video>
                    <p class="text-sm font-bold mt-3 text-white px-1">${v.title || 'Video'}</p>
                    <span class="text-[10px] text-slate-500 block mt-2 px-1"><i class="fa-regular fa-clock mr-1"></i> ${timeAgo(v.timestamp)}</span>
                </div>`;
            });
            
            document.getElementById('content-video').innerHTML = htmlContent || '<p class="text-slate-500 italic col-span-full text-center">Belum ada video.</p>';
        });

        document.addEventListener("DOMContentLoaded", () => { switchTab('status'); });
    </script>
</body>
</html>
