<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio UZIIFAUNAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .active-tab { background-color: #233220; color: #4ade80; border-bottom: 2px solid #4ade80; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <div>
        <nav class="bg-[#121910]/90 backdrop-blur-md sticky top-0 z-50 border-b border-[#233220] px-6 py-4 flex flex-col items-center gap-4">
            <div class="flex w-full justify-between items-center max-w-7xl">
                <span class="font-extrabold text-xl text-emerald-400 tracking-wider">UZIIFAUNAK</span>
                <div class="flex gap-4 text-slate-400 text-sm">
                    <a href="#" class="hover:text-emerald-400"><i class="fa-brands fa-discord"></i></a>
                    <a href="#" class="hover:text-emerald-400"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="hover:text-emerald-400"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="#" class="hover:text-emerald-400"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="#" class="hover:text-emerald-400"><i class="fa-brands fa-canva"></i></a>
                    <a href="login.html" class="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 text-[10px] font-bold px-3 py-1.5 rounded-lg transition ml-2">OWNER</a>
                </div>
            </div>
            <div class="flex flex-wrap justify-center gap-1.5 bg-[#0b0f09] p-1 rounded-xl border border-[#1d291a] font-medium text-[11px] w-full max-w-xl">
                <button onclick="switchTab('home')" id="tab-home" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition active-tab">Beranda</button>
                <button onclick="switchTab('status')" id="tab-status" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Status</button>
                <button onclick="switchTab('pengalaman')" id="tab-pengalaman" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Pengalaman</button>
                <button onclick="switchTab('video')" id="tab-video" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Video</button>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
            <section id="content-home" class="tab-content">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center pt-4">
                    <div class="lg:col-span-7 space-y-6">
                        <span class="text-xs font-bold uppercase tracking-widest text-emerald-400 bg-emerald-950/60 border border-emerald-900/60 px-3 py-1 rounded-md">Portofolio ABHINAYA FAUZI</span>
                        <h1 class="text-4xl lg:text-5xl font-extrabold tracking-tight text-white leading-tight">Welcome to My Workspace</h1>
                        <p class="text-sm text-slate-400 max-w-xl leading-relaxed">Terimakasih sudah mengunjungi website ini.</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                            <div class="card-dark p-4 rounded-xl">
                                <span class="text-[10px] font-bold text-red-400 uppercase">CNN News Update</span>
                                <a id="home-cnn-link" href="#" target="_blank" class="block text-xs text-slate-200 hover:text-emerald-400 font-semibold mt-1">Loading...</a>
                            </div>
                            <div class="card-dark p-4 rounded-xl">
                                <span class="text-[10px] font-bold text-amber-400 uppercase">Current Status</span>
                                <p id="home-status-text" class="text-xs text-slate-300 mt-1">Loading...</p>
                            </div>
                        </div>
                    </div>
                    <div class="lg:col-span-5 flex justify-center">
                        <div class="w-80 h-[380px] bg-emerald-950 rounded-t-full relative overflow-hidden shadow-2xl border-4 border-[#233220]">
                            <img src="https://cdn.discordapp.com/attachments/1142606456558977024/1506000533188644864/WhatsApp_Image_2026-05-19_at_01.23.21.jpeg" class="w-full h-full object-cover grayscale contrast-125">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0f140d] to-transparent"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="content-status" class="tab-content hidden">
                <div class="card-dark p-6 rounded-2xl mb-8 flex items-center gap-4">
                    <img src="https://cdn.discordapp.com/attachments/1142606456558977024/1506000532626477096/WhatsApp_Image_2026-05-19_at_01.23.53.jpeg" class="w-16 h-16 rounded-full object-cover border-2 border-emerald-400">
                    <div>
                        <h2 id="status-name" class="text-xl font-bold text-white">Loading...</h2>
                        <p id="status-bio" class="text-sm text-slate-400 mt-1">Loading...</p>
                    </div>
                </div>
                <div id="widgets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <section id="content-pengalaman" class="tab-content hidden">
                <h1 class="text-3xl font-bold text-white mb-6">Experience</h1>
                <div class="grid grid-cols-1 gap-6" id="experience-list-container"></div>
            </section>

            <section id="content-video" class="tab-content hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="video-grid-container"></div>
            </section>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function timeAgo(dateString) {
            if (!dateString) return "";
            const [d, m, y] = dateString.split('/');
            const date = new Date(y, m - 1, d);
            const now = new Date();
            const diff = Math.floor((now - date) / (1000 * 60));
            if (diff < 1) return "Baru saja";
            if (diff < 60) return diff + " menit yang lalu";
            if (diff < 1440) return Math.floor(diff / 60) + " jam yang lalu";
            return Math.floor(diff / 1440) + " hari yang lalu";
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`content-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('active-tab');
        }

        // Fetch Profil
        db.ref('profile/').on('value', snap => {
            const p = snap.val();
            if (p) {
                document.getElementById('status-name').innerText = p.name;
                document.getElementById('status-bio').innerText = p.bio;
            }
        });

        // Fetch Home
        db.ref('home_custom/').on('value', snap => {
            const data = snap.val() || {};
            document.getElementById('home-cnn-link').innerText = data.cnn_text || "Kunjungi Berita";
            document.getElementById('home-cnn-link').href = data.cnn_link || "#";
            document.getElementById('home-status-text').innerText = data.home_status || "Fokus!";
        });

        // Fetch Widgets
        db.ref('widgets/').on('value', snap => {
            const container = document.getElementById('widgets-container');
            container.innerHTML = '';
            snap.forEach(child => {
                const w = child.val();
                container.innerHTML += `<div class="card-dark p-5 rounded-2xl">
                    <span class="text-[10px] text-emerald-400 font-bold">${w.type}</span>
                    <p class="text-xs text-slate-300 mt-2">"${w.content}"</p>
                    <span class="text-[9px] text-slate-500 block mt-2">${timeAgo(w.timestamp)}</span>
                </div>`;
            });
        });

        // Fetch Experience
        db.ref('experiences/').on('value', snap => {
            const container = document.getElementById('experience-list-container');
            container.innerHTML = '';
            snap.forEach(child => {
                const e = child.val();
                container.innerHTML += `<div class="card-dark p-6 rounded-2xl">
                    <h3 class="font-bold text-white">${e.title}</h3>
                    <p class="text-xs text-slate-400 mt-2">${e.summary}</p>
                    <span class="text-[10px] text-emerald-600 font-bold mt-3 block">${timeAgo(e.timestamp)}</span>
                </div>`;
            });
        });

        // Fetch Video
        db.ref('videos/').on('value', snap => {
            const container = document.getElementById('video-grid-container');
            container.innerHTML = '';
            snap.forEach(child => {
                const v = child.val();
                if(v.privacy === 'public') {
                    container.innerHTML += `<div class="card-dark rounded-xl p-2">
                        <video src="${v.url}" controls class="w-full rounded"></video>
                        <p class="text-xs font-bold mt-2">${v.title}</p>
                        <span class="text-[9px] text-emerald-600">${timeAgo(v.timestamp)}</span>
                    </div>`;
                }
            });
        });
    </script>
</body>
</html>
