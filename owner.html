<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Workspace Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .active-tab { background-color: #233220; color: #4ade80; border-bottom: 2px solid #4ade80; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <nav class="bg-[#121910]/90 backdrop-blur-md border-b border-[#233220] px-4 py-4 flex flex-col gap-4 sticky top-0 z-50">
        <div class="flex justify-between items-center w-full">
            <span class="font-extrabold text-lg text-emerald-400 tracking-wider">UZIIFAUNAK CONSOLE</span>
            <button onclick="handleLogout()" class="bg-red-500/10 text-red-400 border border-red-900/40 text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">Logout</button>
        </div>
        <div class="flex flex-wrap justify-center gap-1.5 bg-[#0b0f09] p-1 rounded-xl border border-[#1d291a] font-medium text-[10px]">
            <button onclick="switchTab('home')" id="tab-home" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition active-tab">Home Mod</button>
            <button onclick="switchTab('status')" id="tab-status" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition">Status Mod</button>
            <button onclick="switchTab('pengalaman')" id="tab-pengalaman" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition">Exp Mod</button>
            <button onclick="switchTab('video')" id="tab-video" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition">Video Mod</button>
        </div>
    </nav>

    <main class="max-w-7xl w-full mx-auto px-4 py-8 flex-1">
        <section id="content-home" class="tab-content"><h1 class="text-lg font-bold text-white mb-2">Home Configuration</h1></section>
        <section id="content-status" class="tab-content hidden"><h1 class="text-lg font-bold text-white mb-4">Aktivitas Cloud</h1><div id="widgets-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></section>
        <section id="content-pengalaman" class="tab-content hidden"><h1 class="text-lg font-bold text-white mb-4">Daftar Pengalaman</h1><div id="experience-list-container" class="grid grid-cols-1 gap-4"></div></section>
        <section id="content-video" class="tab-content hidden"><h1 class="text-lg font-bold text-white mb-4">Video Management (All)</h1><div id="video-grid-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></section>
    </main>

    <script>
        if(localStorage.getItem('uzi_session_active') !== 'true') { window.location.href = 'login.html'; }
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`content-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('active-tab');
        }

        function deleteItem(ref, id) {
            if(confirm('Yakin ingin menghapus data ini?')) {
                db.ref(ref + '/' + id).remove().then(() => alert('Berhasil dihapus.'));
            }
        }

        function handleLogout() { localStorage.removeItem('uzi_session_active'); window.location.href = 'index.html'; }

        // RENDER VIDEO (Tanpa filter agar semua muncul di Console)
        db.ref('videos/').on('value', snap => {
            const container = document.getElementById('video-grid-container');
            container.innerHTML = '';
            snap.forEach(child => {
                const v = child.val();
                container.innerHTML += `<div class="card-dark p-4 rounded-xl relative">
                    <button onclick="deleteItem('videos', '${child.key}')" class="absolute top-2 right-2 text-red-500 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                    <p class="text-xs font-bold">${v.title}</p>
                    <video src="${v.url}" class="w-full mt-2 rounded"></video>
                    <p class="text-[9px] text-slate-500 mt-2">Privacy: ${v.privacy || 'public'}</p>
                </div>`;
            });
        });

        // RENDER STATUS/WIDGET
        db.ref('widgets/').on('value', snap => {
            const container = document.getElementById('widgets-container');
            container.innerHTML = '';
            snap.forEach(child => {
                container.innerHTML += `<div class="card-dark p-4 rounded-xl relative">
                    <button onclick="deleteItem('widgets', '${child.key}')" class="absolute top-2 right-2 text-red-500 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                    <p class="text-[10px] text-emerald-400 font-bold uppercase">${child.val().type}</p>
                    <p class="text-xs mt-2">${child.val().content}</p>
                </div>`;
            });
        });

        // RENDER PENGALAMAN
        db.ref('experiences/').on('value', snap => {
            const container = document.getElementById('experience-list-container');
            container.innerHTML = '';
            snap.forEach(child => {
                container.innerHTML += `<div class="card-dark p-4 rounded-xl flex justify-between items-center">
                    <span class="text-xs font-bold">${child.val().title}</span>
                    <button onclick="deleteItem('experiences', '${child.key}')" class="text-red-500 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
        });
    </script>
</body>
</html>
