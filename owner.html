<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Workspace Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .active-tab { background-color: #233220; color: #4ade80; border-bottom: 2px solid #4ade80; }
        .input-dark { width: 100%; background-color: #0b0f09; border: 1px solid #065f46; color: white; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; outline: none; }
        .input-dark:focus { border-color: #34d399; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <nav class="bg-[#121910]/90 backdrop-blur-md border-b border-[#233220] px-4 py-4 flex flex-col gap-4 sticky top-0 z-50">
        <div class="flex justify-between items-center w-full max-w-7xl mx-auto">
            <span class="font-extrabold text-lg text-emerald-400 tracking-wider"><i class="fa-solid fa-terminal mr-2"></i>OWNER CONSOLE</span>
            <button onclick="handleLogout()" class="bg-red-500/10 text-red-400 border border-red-900/40 text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">Logout System</button>
        </div>
        <div class="flex flex-wrap justify-center gap-2 bg-[#0b0f09] p-1.5 rounded-xl border border-[#1d291a] font-medium text-[11px] sm:text-xs max-w-2xl mx-auto">
            <button onclick="switchTab('status')" id="tab-status" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition active-tab">Input Status Baru</button>
            <button onclick="switchTab('pengalaman')" id="tab-pengalaman" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Input Pengalaman</button>
            <button onclick="switchTab('video')" id="tab-video" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">Input Video</button>
            <button onclick="switchTab('manage')" id="tab-manage" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition bg-red-950/20 text-red-300">Hapus Data</button>
        </div>
    </nav>

    <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">
        
        <section id="content-status" class="tab-content">
            <div class="card-dark p-6 rounded-2xl max-w-2xl mx-auto shadow-2xl">
                <h1 class="text-xl font-bold text-white mb-6 border-b border-[#233220] pb-3"><i class="fa-solid fa-pen-nib mr-2 text-emerald-500"></i>Upload Status / Catatan Harian</h1>
                
                <input type="text" id="widget-type" placeholder="Jenis (Contoh: NOTA HARIAN, MUSIC, TREND...)" class="input-dark font-bold text-emerald-400">
                <input type="text" id="widget-sender" placeholder="Nama Pengirim" class="input-dark">
                <input type="text" id="widget-short" placeholder="Catatan Singkat / Judul" class="input-dark">
                <textarea id="widget-long" placeholder="Catatan Panjang / Deskripsi lengkap..." class="input-dark h-28 resize-none"></textarea>
                <input type="text" id="widget-media" placeholder="Link File Gambar atau Video (URL.jpg / URL.mp4) opsional..." class="input-dark">
                
                <button onclick="pushWidget()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-extrabold text-sm py-3 rounded-xl transition shadow-lg shadow-emerald-900/20">
                    <i class="fa-solid fa-paper-plane mr-2"></i>POSTING STATUS
                </button>
            </div>
        </section>

        <section id="content-pengalaman" class="tab-content hidden">
            <div class="card-dark p-6 rounded-2xl max-w-2xl mx-auto shadow-2xl">
                <h1 class="text-xl font-bold text-white mb-6 border-b border-[#233220] pb-3"><i class="fa-solid fa-medal mr-2 text-emerald-500"></i>Upload Pengalaman & Sertifikat</h1>
                
                <input type="text" id="exp-title" placeholder="Judul Pengalaman / Nama Sertifikat" class="input-dark font-bold">
                <textarea id="exp-summary" placeholder="Ringkasan pengalaman..." class="input-dark h-24 resize-none"></textarea>
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="exp-start" placeholder="Tgl Mulai (ex: Jan 2024)" class="input-dark">
                    <input type="text" id="exp-end" placeholder="Tgl Selesai (ex: Mar 2026)" class="input-dark">
                </div>
                
                <div class="grid grid-cols-4 gap-4">
                    <select id="exp-stars" class="input-dark col-span-1 cursor-pointer">
                        <option value="1">1 Bintang</option>
                        <option value="2">2 Bintang</option>
                        <option value="3">3 Bintang</option>
                        <option value="4">4 Bintang</option>
                        <option value="5" selected>5 Bintang</option>
                    </select>
                    <input type="text" id="exp-img" placeholder="Link Foto Sertifikat (URL)..." class="input-dark col-span-3">
                </div>

                <button onclick="pushExperience()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-extrabold text-sm py-3 rounded-xl transition shadow-lg shadow-emerald-900/20">
                    <i class="fa-solid fa-upload mr-2"></i>UPLOAD PENGALAMAN
                </button>
            </div>
        </section>

        <section id="content-video" class="tab-content hidden">
            <div class="card-dark p-6 rounded-2xl max-w-xl mx-auto shadow-2xl">
                <h1 class="text-xl font-bold text-white mb-6 border-b border-[#233220] pb-3"><i class="fa-solid fa-video mr-2 text-emerald-500"></i>Upload Video Random</h1>
                
                <input type="text" id="vid-title" placeholder="Judul Video" class="input-dark font-bold">
                <input type="text" id="vid-url" placeholder="Link URL Video (.mp4)" class="input-dark">
                
                <button onclick="pushVideo()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-extrabold text-sm py-3 rounded-xl transition shadow-lg shadow-emerald-900/20">
                    <i class="fa-solid fa-broadcast-tower mr-2"></i>BROADCAST VIDEO
                </button>
            </div>
        </section>

        <section id="content-manage" class="tab-content hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="card-dark p-4 rounded-xl">
                    <h2 class="text-sm font-bold text-emerald-400 mb-4 uppercase">List Status</h2>
                    <div id="manage-widgets" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
                </div>

                <div class="card-dark p-4 rounded-xl">
                    <h2 class="text-sm font-bold text-emerald-400 mb-4 uppercase">List Pengalaman</h2>
                    <div id="manage-experiences" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
                </div>

                <div class="card-dark p-4 rounded-xl">
                    <h2 class="text-sm font-bold text-emerald-400 mb-4 uppercase">List Video</h2>
                    <div id="manage-videos" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // Proteksi Halaman
        if(localStorage.getItem('uzi_session_active') !== 'true') { window.location.href = 'login.html'; }
        
        // Inisialisasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e",
            measurementId: "G-0ZJTEGNXTW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab', 'text-white'));
            document.getElementById(`content-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('active-tab', 'text-white');
        }

        function handleLogout() { 
            localStorage.removeItem('uzi_session_active'); 
            window.location.href = 'index.html'; 
        }

        // FUNGSI UPLOAD STATUS BARU
        function pushWidget() { 
            const typeVal = document.getElementById('widget-type').value || 'STATUS';
            const senderVal = document.getElementById('widget-sender').value;
            const shortVal = document.getElementById('widget-short').value;
            const longVal = document.getElementById('widget-long').value;
            const mediaVal = document.getElementById('widget-media').value;
            
            if(!shortVal && !longVal && !mediaVal) {
                alert("Isi minimal catatan atau masukkan file!"); return;
            }

            db.ref('widgets/').push({ 
                type: typeVal,
                sender: senderVal,
                short_note: shortVal,
                long_note: longVal,
                media: mediaVal,
                timestamp: Date.now() 
            }).then(() => {
                alert('Status Berhasil Diposting!');
                // Clear input
                document.getElementById('widget-short').value = '';
                document.getElementById('widget-long').value = '';
                document.getElementById('widget-media').value = '';
            });
        }

        // FUNGSI UPLOAD PENGALAMAN
        function pushExperience() { 
            const titleVal = document.getElementById('exp-title').value;
            
            if(!titleVal) { alert("Judul pengalaman wajib diisi!"); return; }

            db.ref('experiences/').push({ 
                title: titleVal, 
                summary: document.getElementById('exp-summary').value,
                start_date: document.getElementById('exp-start').value,
                end_date: document.getElementById('exp-end').value,
                img: document.getElementById('exp-img').value,
                stars: document.getElementById('exp-stars').value,
                timestamp: Date.now()
            }).then(() => {
                alert('Pengalaman Berhasil Disimpan!');
                document.getElementById('exp-title').value = '';
                document.getElementById('exp-summary').value = '';
                document.getElementById('exp-img').value = '';
            });
        }
        
        // FUNGSI UPLOAD VIDEO
        function pushVideo() { 
            const titleVal = document.getElementById('vid-title').value;
            const urlVal = document.getElementById('vid-url').value;

            if(!titleVal || !urlVal) { alert("Judul dan URL wajib diisi!"); return; }

            db.ref('videos/').push({ 
                title: titleVal, 
                url: urlVal,
                timestamp: Date.now()
            }).then(() => {
                alert('Video Berhasil Dibroadcast!');
                document.getElementById('vid-title').value = '';
                document.getElementById('vid-url').value = '';
            });
        }

        // REALTIME LISTER UNTUK MANAGE (DELETE) DATA
        db.ref('widgets/').on('value', snap => {
            const container = document.getElementById('manage-widgets');
            container.innerHTML = '';
            snap.forEach(child => {
                const w = child.val();
                container.innerHTML += `<div class="bg-[#0b0f09] p-3 rounded-lg border border-[#233220] flex justify-between items-center"><div class="truncate pr-2"><p class="text-[10px] text-emerald-400 font-bold">${w.type}</p><p class="text-xs text-white truncate w-40">${w.short_note || 'Tidak ada judul'}</p></div><button onclick="deleteCloudItem('widgets', '${child.key}')" class="bg-red-950 text-red-400 hover:text-white px-3 py-1 rounded text-[10px]"><i class="fa-solid fa-trash"></i></button></div>`;
            });
        });

        db.ref('experiences/').on('value', snap => {
            const container = document.getElementById('manage-experiences');
            container.innerHTML = '';
            snap.forEach(child => {
                const e = child.val();
                container.innerHTML += `<div class="bg-[#0b0f09] p-3 rounded-lg border border-[#233220] flex justify-between items-center"><div class="truncate pr-2"><p class="text-xs text-white truncate w-40 font-bold">${e.title}</p><p class="text-[10px] text-slate-400">${e.stars} Bintang</p></div><button onclick="deleteCloudItem('experiences', '${child.key}')" class="bg-red-950 text-red-400 hover:text-white px-3 py-1 rounded text-[10px]"><i class="fa-solid fa-trash"></i></button></div>`;
            });
        });

        db.ref('videos/').on('value', snap => {
            const container = document.getElementById('manage-videos');
            container.innerHTML = '';
            snap.forEach(child => {
                const v = child.val();
                container.innerHTML += `<div class="bg-[#0b0f09] p-3 rounded-lg border border-[#233220] flex justify-between items-center"><p class="text-xs text-white truncate w-40 pr-2">${v.title}</p><button onclick="deleteCloudItem('videos', '${child.key}')" class="bg-red-950 text-red-400 hover:text-white px-3 py-1 rounded text-[10px]"><i class="fa-solid fa-trash"></i></button></div>`;
            });
        });

        function deleteCloudItem(path, key) { 
            if(confirm('Yakin ingin menghapus data ini secara permanen?')) { 
                db.ref(`${path}/${key}`).remove(); 
            } 
        }
        
        document.addEventListener("DOMContentLoaded", () => { switchTab('status'); });
    </script>
</body>
</html>
