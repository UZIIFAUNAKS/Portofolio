<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Workspace Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .active-tab { background-color: #233220; color: #4ade80; border-bottom: 2px solid #4ade80; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <nav class="bg-[#121910]/90 backdrop-blur-md border-b border-[#233220] px-4 py-4 flex flex-col gap-4 sticky top-0 z-50">
        <div class="flex justify-between items-center w-full">
            <span class="font-extrabold text-lg text-emerald-400 tracking-wider">UZIIFAUNAK</span>
            <button onclick="handleLogout()" class="bg-red-500/10 text-red-400 border border-red-900/40 text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">Logout</button>
        </div>
        <div class="flex flex-wrap justify-center gap-1.5 bg-[#0b0f09] p-1 rounded-xl border border-[#1d291a] font-medium text-[10px] sm:text-xs">
            <button onclick="switchTab('home')" id="tab-home" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition active-tab">Home Mod</button>
            <button onclick="switchTab('status')" id="tab-status" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition">Status Mod</button>
            <button onclick="switchTab('pengalaman')" id="tab-pengalaman" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition">Exp Mod</button>
            <button onclick="switchTab('video')" id="tab-video" class="px-3 py-2 rounded-lg text-slate-400 hover:text-white transition">Video Mod</button>
        </div>
    </nav>

    <main class="max-w-7xl w-full mx-auto px-4 py-8 flex-1">
        <section id="content-home" class="tab-content">
            <h1 class="text-lg font-bold text-white mb-2">Home Header Live Monitor</h1>
            <div id="home-monitor-box" class="card-dark p-4 rounded-xl max-w-md">
                <p class="text-xs text-emerald-400 font-bold">Status Utama Saat Ini:</p>
                <p id="live-home-status" class="text-xs text-slate-300 mt-1 italic">Loading...</p>
            </div>
        </section>
        <section id="content-status" class="tab-content hidden">
            <h1 class="text-lg font-bold text-white mb-4">Aktivitas Cloud</h1>
            <div id="widgets-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>
        <section id="content-pengalaman" class="tab-content hidden">
            <h1 class="text-lg font-bold text-white mb-4">Daftar Pengalaman</h1>
            <div id="experience-list-container" class="grid grid-cols-1 gap-4"></div>
        </section>
        <section id="content-video" class="tab-content hidden">
            <h1 class="text-lg font-bold text-white mb-4">Video Management</h1>
            <div id="video-grid-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <div class="w-full bg-[#11170e] border-t border-[#233220] p-6">
        <div class="max-w-7xl w-full mx-auto">
            <div id="sub-console-home" class="sub-console grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="card-dark p-4 space-y-2">
                    <input type="text" id="edit-cnn-text" placeholder="Judul Berita..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <input type="text" id="edit-cnn-link" placeholder="Link..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <button onclick="saveCnnNews()" class="bg-red-600 text-white font-bold text-xs px-4 py-1.5 rounded">Update Berita</button>
                </div>
                <div class="card-dark p-4 space-y-2">
                    <input type="text" id="edit-home-status" placeholder="Status..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <button onclick="saveHomeStatus()" class="bg-amber-500 text-neutral-950 font-bold text-xs px-4 py-1.5 rounded">Update Status</button>
                </div>
            </div>
            
            <div id="sub-console-status" class="sub-console hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="card-dark p-4 space-y-2">
                    <input type="text" id="edit-name" placeholder="Nama Profil..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <input type="text" id="edit-bio" placeholder="Bio..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <button onclick="saveProfile()" class="bg-emerald-500 text-neutral-950 font-bold text-xs px-4 py-1.5 rounded">Update Profil</button>
                </div>
                <div class="card-dark p-4 space-y-2">
                    <select id="widget-type" class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-slate-300">
                        <option value="Nota Harian">Nota Harian</option>
                        <option value="Lagu Online">Lagu Online</option>
                        <option value="Foto Postingan">Foto Postingan</option>
                    </select>
                    <input type="text" id="widget-content" placeholder="Deskripsi..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <input type="text" id="widget-img" placeholder="URL Gambar..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                    <button onclick="pushWidget()" class="w-full bg-emerald-500 text-neutral-950 font-bold text-xs py-2 rounded">Push Widget</button>
                </div>
            </div>

            <div id="sub-console-pengalaman" class="sub-console hidden card-dark p-4 space-y-3">
                <input type="text" id="exp-title" placeholder="Nama Proyek/Sertifikat" class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <input type="text" id="exp-summary" placeholder="Deskripsi singkat..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <input type="text" id="exp-start" placeholder="Tanggal Mulai" class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <input type="text" id="exp-end" placeholder="Tanggal Selesai" class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <input type="text" id="exp-img" placeholder="Link Foto Sertifikat..." class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <button onclick="pushExperience()" class="bg-emerald-500 text-neutral-950 font-bold text-xs px-5 py-2 rounded-xl">Inject Exp</button>
            </div>

            <div id="sub-console-video" class="sub-console hidden card-dark p-4 space-y-2">
                <input type="text" id="vid-title" placeholder="Judul Video" class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <input type="text" id="vid-url" placeholder="URL Video" class="w-full bg-[#0b0f09] border border-emerald-900 text-xs p-2 rounded text-white">
                <button onclick="pushVideo()" class="bg-emerald-500 text-neutral-950 font-bold text-xs px-4 py-2 rounded">Broadcast</button>
            </div>
        </div>
    </div>

    <script>
        if(localStorage.getItem('uzi_session_active') !== 'true') { window.location.href = 'login.html'; }
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e",
            measurementId: "G-0ZJTEGNXTW"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`content-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('active-tab');
            document.querySelectorAll('.sub-console').forEach(sc => sc.classList.add('hidden'));
            if(document.getElementById(`sub-console-${t}`)) document.getElementById(`sub-console-${t}`).classList.remove('hidden');
        }
        function handleLogout() { localStorage.removeItem('uzi_session_active'); window.location.href = 'index.html'; }
        
        // Functions with updated fields
        function pushWidget() { 
            db.ref('widgets/').push({ 
                type: document.getElementById('widget-type').value, 
                content: document.getElementById('widget-content').value, 
                img: document.getElementById('widget-img').value, 
                timestamp: Date.now() 
            }); alert('Aktivitas Terkirim!'); 
        }
        function pushExperience() { 
            db.ref('experiences/').push({ 
                title: document.getElementById('exp-title').value, 
                summary: document.getElementById('exp-summary').value,
                start: document.getElementById('exp-start').value,
                end: document.getElementById('exp-end').value,
                img: document.getElementById('exp-img').value
            }); alert('Pengalaman Disuntikkan!'); 
        }
        
        // Other functions remain the same as your request
        function saveCnnNews() { db.ref('home_custom/').update({ cnn_text: document.getElementById('edit-cnn-text').value, cnn_link: document.getElementById('edit-cnn-link').value }); alert('Berita Diperbarui!'); }
        function saveHomeStatus() { db.ref('home_custom/').update({ home_status: document.getElementById('edit-home-status').value }); alert('Status Diperbarui!'); }
        function saveProfile() { db.ref('profile/').set({ name: document.getElementById('edit-name').value, bio: document.getElementById('edit-bio').value }); alert('Profil Diperbarui!'); }
        function pushVideo() { db.ref('videos/').push({ title: document.getElementById('vid-title').value, url: document.getElementById('vid-url').value }); alert('Sinyal Video Online!'); }
        function deleteCloudItem(path, key) { if(confirm('Hapus item?')) { db.ref(`${path}/${key}`).remove(); } }
        
        document.addEventListener("DOMContentLoaded", () => { switchTab('home'); });
    </script>
</body>
</html>
