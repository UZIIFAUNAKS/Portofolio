<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Workspace Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f140d; }
        .card-dark { background-color: #161f14; border: 1px solid #233220; }
        .input-dark { background-color: #0b0f09; border: 1px solid #233220; color: white; }
    </style>
</head>
<body class="text-slate-200 p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-emerald-400">Owner Console</h1>
            <button onclick="window.location.href='index.html'" class="text-xs bg-red-900/20 text-red-400 px-4 py-2 rounded-lg">Logout</button>
        </div>

        <div class="card-dark p-6 rounded-2xl mb-6">
            <h2 class="font-bold mb-4">Edit Profil</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="edit-name" type="text" placeholder="Nama" class="input-dark p-2 rounded-lg text-sm">
                <input id="edit-bio" type="text" placeholder="Bio" class="input-dark p-2 rounded-lg text-sm">
                <button onclick="saveProfile()" class="bg-emerald-500 text-neutral-950 font-bold p-2 rounded-lg text-sm">Update Profil</button>
            </div>
        </div>

        <div class="card-dark p-6 rounded-2xl mb-6">
            <h2 class="font-bold mb-4">Tambah Widget Status</h2>
            <div class="grid grid-cols-1 gap-4">
                <input id="widget-type" type="text" placeholder="Tipe (Contoh: Update)" class="input-dark p-2 rounded-lg text-sm">
                <textarea id="widget-content" placeholder="Isi konten..." class="input-dark p-2 rounded-lg text-sm h-20"></textarea>
                <button onclick="pushWidget()" class="bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">Kirim Widget</button>
            </div>
        </div>

        <div class="card-dark p-6 rounded-2xl mb-6">
            <h2 class="font-bold mb-4">Tambah Pengalaman</h2>
            <div class="grid grid-cols-1 gap-4">
                <input id="exp-title" type="text" placeholder="Judul Pengalaman" class="input-dark p-2 rounded-lg text-sm">
                <input id="exp-summary" type="text" placeholder="Summary" class="input-dark p-2 rounded-lg text-sm">
                <button onclick="pushExperience()" class="bg-emerald-600 text-white font-bold p-2 rounded-lg text-sm">Tambah Pengalaman</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZ7xMFlPZO0BjjHXKVpY3-yaoR-wUAjhk",
            authDomain: "portofolio-uzi.firebaseapp.com",
            databaseURL: "https://portofolio-uzi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "portofolio-uzi",
            storageBucket: "portofolio-uzi.firebasestorage.app",
            messagingSenderId: "190552716843",
            appId: "1:190552716843:web:32d9c26f299867bfc19c6e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Validasi Sesi
        if (localStorage.getItem('uzi_session_active') !== 'true') {
            window.location.href = 'login.html';
        }

        function saveProfile() {
            db.ref('profile/').set({
                name: document.getElementById('edit-name').value,
                bio: document.getElementById('edit-bio').value
            }).then(() => alert('Profil Diperbarui!'));
        }

        function pushWidget() {
            db.ref('widgets/').push({
                type: document.getElementById('widget-type').value,
                content: document.getElementById('widget-content').value,
                timestamp: Date.now()
            }).then(() => alert('Widget Berhasil Ditambah!'));
        }

        function pushExperience() {
            db.ref('experiences/').push({
                title: document.getElementById('exp-title').value,
                summary: document.getElementById('exp-summary').value,
                timestamp: Date.now()
            }).then(() => alert('Pengalaman Berhasil Ditambah!'));
        }
    </script>
</body>
</html>
